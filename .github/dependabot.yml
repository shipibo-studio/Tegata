# Dependency updates. Without this file, Dependabot only opens security updates:
# it would not bump the SHA-pinned GitHub Actions.
#

version: 2
updates:
  # Keep the SHA-pinned actions current. Monthly and grouped into a single pull
  # request, so update noise does not bury security updates.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope

  # Swift packages (none today: Tegata has no third-party dependencies, and keeps it that way).
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
